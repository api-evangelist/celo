aid: celo
name: Celo
description: >-
  Celo is a leading Ethereum Layer 2 (L2) blockchain built for real-world
  usage, mobile-first payments, and stablecoins, run by cLabs and the Celo
  Foundation. It offers a fully EVM- and Ethereum-JSON-RPC-compatible network
  reachable through the public Forno RPC endpoints, gas-fee abstraction that lets
  users pay fees in stablecoins, and a developer stack spanning TypeScript SDKs
  (ContractKit, @celo/connect, @celo/abis, @celo/identity), the Celo Composer
  CLI scaffolding tool, a published Model Context Protocol (MCP) server for AI
  agents, and agent-payment protocols (x402, MPP, ERC-8004). Developers build
  dApps, MiniPay mini-apps, DeFi, and AI agents against the Celo Mainnet
  (chain 42220) and the Celo Sepolia testnet.
